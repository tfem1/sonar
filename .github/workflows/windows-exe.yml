name: windows exe

# Builds the standalone sonar.exe (Windows 10 / 11, no Python needed) on every push.
# When VERSION in sonar.py has no release yet, publishes release vVERSION with sonar.exe.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: build sonar.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --onefile --console --name sonar --icon assets/sonar.ico --clean sonar.py
          $v = (python sonar.py -V).Split(" ")[1]
          "VERSION=$v" >> $env:GITHUB_ENV
          Get-Item dist\sonar.exe | Format-List Name, Length

      - name: Smoke test
        shell: pwsh
        env:
          COLUMNS: "100"
          LINES: "30"
        run: |
          $out = & dist\sonar.exe -V
          if ($LASTEXITCODE -or $out -ne "sonar $env:VERSION") { throw "bad version output: $out" }
          cmd /c "dist\sonar.exe --once --no-color > snapshot.txt"
          if ($LASTEXITCODE) { throw "--once failed" }
          $env:PYTHONIOENCODING = "utf-8"
          python -c "t=open('snapshot.txt',encoding='utf-8').read(); print('::notice title=sonar.exe snapshot::' + t.replace('%','%25').replace('\n','%0A'))"
          & dist\sonar.exe -l | Select-Object -First 3   # piped: must not crash on cp1252
          if ($LASTEXITCODE) { throw "-l failed when piped" }

      - name: Self-update test (old sonar.exe -> this build)
        shell: pwsh
        run: python tests/exe_update_test.py dist/sonar.exe

      - name: install.ps1 with sonar.exe (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:SONAR_EXE = "1"
          $env:SONAR_EXE_URL = (Resolve-Path dist\sonar.exe).Path
          powershell -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE) { exit 1 }
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          sonar -V
          if ($LASTEXITCODE) { exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\Programs\sonar\sonar.cmd") { throw "python shim left next to sonar.exe" }
          powershell -ExecutionPolicy Bypass -File install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\sonar") { throw "uninstall left files" }

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-exe
          path: dist/sonar.exe

      - name: Publish release (only when VERSION is new)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { "release v$env:VERSION already exists, nothing to publish"; exit 0 }
          gh release create "v$env:VERSION" dist/sonar.exe sonar.py --target $env:GITHUB_SHA `
            --title "sonar $env:VERSION" --notes "Windows 10 / 11: download **sonar.exe** and run it (no Python needed). Linux: see the README."
